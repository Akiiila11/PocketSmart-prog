{% extends "base.html" %}
{% block content %}
<div class="form-card"><h1>Login</h1>
{% if request.query_params.get('error') %}<p class="error">{{ request.query_params.get('error') }}</p>{% endif %}
{% if request.query_params.get('message') %}<p class="success">{{ request.query_params.get('message') }}</p>{% endif %}
<form method="post">
<label>Email<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" required></label>
<button class="btn">Login</button>
</form></div>
{% endblock %}
